<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
  <title id="title">LearnIT 챗봇 아키텍처</title>
  <desc id="desc">Browser, Spring Boot, Python chat-agent로 역할을 분리한 LearnIT 챗봇 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60738c"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; rx: 20; ry: 20; }
      .subbox { fill: #f8fbff; stroke: #d9e2ec; stroke-width: 1.5; rx: 14; ry: 14; }
      .chip { fill: #eef4fb; stroke: #d7e3f0; stroke-width: 1; rx: 999; ry: 999; }
      .title { font: 700 38px 'Noto Sans KR', sans-serif; fill: #173a76; }
      .subtitle { font: 500 18px 'Noto Sans KR', sans-serif; fill: #64748b; }
      .label { font: 700 28px 'Noto Sans KR', sans-serif; fill: #172033; }
      .sub { font: 600 18px 'Noto Sans KR', sans-serif; fill: #48617f; }
      .text { font: 500 18px 'Noto Sans KR', sans-serif; fill: #425466; }
      .small { font: 500 16px 'Noto Sans KR', sans-serif; fill: #6b7b90; }
      .chiptext { font: 500 15px 'Noto Sans KR', sans-serif; fill: #506782; }
      .arrow { stroke: #60738c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-label { font: 600 15px 'Noto Sans KR', sans-serif; fill: #526983; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1280"/>
  <g transform="translate(30 80)">
    <text x="690" y="64" text-anchor="middle" class="title">LearnIT 챗봇 아키텍처</text>
    <text x="690" y="98" text-anchor="middle" class="subtitle">Browser, Spring Boot, Python chat-agent로 역할을 분리한 구조</text>

    <rect x="340" y="150" width="700" height="230" class="panel"/>
    <text x="690" y="198" text-anchor="middle" class="label">Browser</text>
    <text x="690" y="228" text-anchor="middle" class="sub">Thymeleaf + chatbot.js</text>
    <rect x="430" y="276" width="125" height="40" class="chip"/>
    <text x="492" y="301" text-anchor="middle" class="chiptext">UI 렌더링</text>
    <rect x="575" y="276" width="150" height="40" class="chip"/>
    <text x="650" y="301" text-anchor="middle" class="chiptext">sessionId 유지</text>
    <rect x="745" y="276" width="130" height="40" class="chip"/>
    <text x="810" y="301" text-anchor="middle" class="chiptext">메시지 전송</text>
    <text x="690" y="348" text-anchor="middle" class="text">사용자 입력을 받아 챗봇 API로 전달하고</text>
    <text x="690" y="374" text-anchor="middle" class="text">대화 흐름을 이어가는 화면 계층</text>

    <path class="arrow" d="M690 380 L690 430"/>
    <text x="712" y="412" class="line-label">HTTP JSON</text>

    <rect x="100" y="440" width="1180" height="380" class="panel"/>
    <text x="690" y="490" text-anchor="middle" class="label">Spring Boot</text>
    <text x="690" y="520" text-anchor="middle" class="sub">LearnIT Web / API Server</text>

    <rect x="135" y="580" width="360" height="150" class="subbox"/>
    <text x="315" y="620" text-anchor="middle" class="sub">ChatbotApiController</text>
    <text x="315" y="651" text-anchor="middle" class="text">POST /api/chatbot/chat</text>
    <text x="315" y="681" text-anchor="middle" class="small">브라우저 요청 수신</text>
    <text x="315" y="705" text-anchor="middle" class="small">sessionId, message 전달</text>

    <rect x="645" y="580" width="480" height="150" class="subbox"/>
    <text x="885" y="620" text-anchor="middle" class="sub">Course APIs</text>
    <text x="885" y="651" text-anchor="middle" class="text">/api/search/courses · /api/courses</text>
    <text x="885" y="679" text-anchor="middle" class="text">/courses/{id}</text>
    <text x="885" y="705" text-anchor="middle" class="small">추천과 상세 조회에 필요한 강의 데이터를 제공</text>

    <text x="690" y="785" text-anchor="middle" class="text">Spring은 챗봇 요청을 중계하고, 실제 강의 데이터는</text>
    <text x="690" y="811" text-anchor="middle" class="text">내부 Course API를 통해서만 제공</text>

    <path class="arrow" d="M690 820 L690 870"/>
    <text x="712" y="852" class="line-label">HTTP JSON</text>

    <rect x="310" y="890" width="760" height="250" class="panel"/>
    <text x="690" y="942" text-anchor="middle" class="label">Python chat-agent</text>
    <text x="690" y="972" text-anchor="middle" class="sub">FastAPI / CLI 혼합 구조</text>

    <rect x="410" y="1010" width="125" height="40" class="chip"/>
    <text x="472" y="1035" text-anchor="middle" class="chiptext">추천 분기</text>
    <rect x="555" y="1010" width="125" height="40" class="chip"/>
    <text x="617" y="1035" text-anchor="middle" class="chiptext">상세 조회</text>
    <rect x="700" y="1010" width="180" height="40" class="chip"/>
    <text x="790" y="1035" text-anchor="middle" class="chiptext">last_courses 관리</text>

    <text x="690" y="1088" text-anchor="middle" class="text">사용자 자연어를 해석하고 추천과 상세 질문을 분기하며</text>
    <text x="690" y="1114" text-anchor="middle" class="text">필요한 강의 데이터는 Spring API를 호출해 가져옴</text>

    <path class="arrow" d="M495 655 L645 655"/>
    <text x="530" y="633" class="line-label">chat-agent 호출</text>

    <path class="arrow" d="M860 730 C860 845, 790 845, 790 890"/>
    <text x="930" y="835" class="line-label">강의 데이터 조회</text>

    <path class="arrow" d="M505 890 C505 840, 350 840, 350 730"/>
    <text x="180" y="835" class="line-label">reply, items 반환</text>
  </g>
</svg>
